<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Social Listening Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <style>
    /* --- Globale Resets & Scrollbar-Fixes --- */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body, #root { 
      height: 100vh; 
      width: 100vw;
      overflow: hidden;
      font-family: 'Lato', sans-serif; 
      background: #f4f4f4; 
      color: #000000;
    }

    /* Schicke, dezente Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f4f4f4; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    /* --- App Layout Strukturen --- */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px); /* Exakte Rest-Höhe nach Header */
      overflow: hidden;
    }

    /* Jede Spalte erhält ihr eigenes, sauberes Scroll-Verhalten */
    .sidebar, .feed-container, .right-panel {
      height: 100%;
      background: #ffffff;
    }

    .sidebar { 
      width: 220px; 
      border-right: 1px solid #d9d9d9; 
      flex-shrink: 0; 
      overflow-y: auto;
    }
    
    .feed-container { 
      flex: 1; 
      background: #f4f4f4; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
    }
    
    .right-panel { 
      width: 220px; 
      border-left: 1px solid #d9d9d9; 
      padding: 20px 15px; 
      flex-shrink: 0; 
      overflow-y: auto;
    }

    /* --- UI Komponenten & Utilities --- */
    .header {
      background: #ffffff;
      border-bottom: 1px solid #d9d9d9;
      flex-shrink: 0;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 25px;
    }

    .filter-bar {
      background: #ffffff;
      border-bottom: 1px solid #d9d9d9;
      padding: 10px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .feed-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    /* Form-Elemente */
    select, input, button {
      font-family: 'Lato', sans-serif;
      outline: none;
    }
    
    .input-field {
      background: #f4f4f4;
      border: 1px solid #d9d9d9;
      padding: 6px 12px;
      font-size: 13px;
      width: 160px;
    }

      background: #ffffff;
      border: 1px solid #d9d9d9
