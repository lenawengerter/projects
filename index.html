<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Social Listening Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    /* --- Globale Resets & Scrollbar-Fixes --- */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body, #root { 
      height: 100vh; 
      width: 100vw;
      overflow: hidden; /* Verhindert das globale App-Scrollen */
      font-family: 'Lato', sans-serif; 
      background: #f4f4f4; 
      color: #000000;
    }

    /* Schicke, dezente Scrollbars für moderne Browser */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f4f4f4; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    /* --- App Layout Strukturen --- */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px); /* Exakte Rest-Höhe nach Header */
      overflow: hidden;
    }

    /* Jede Spalte erhält ihr eigenes, sauberes Scroll-Verhalten */
    .sidebar, .feed-container, .right-panel {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* Smooth Scrolling für iOS */
      background: #ffffff;
    }

    .sidebar { width: 220px; border-right: 1px solid #d9d9d9; flex-shrink: 0; }
    .feed-container { flex: 1; background: #f4f4f4; display: flex; flex-direction: column; }
    .right-panel { width: 220px; border-left: 1px solid #d9d9d9; padding: 20px 15px; flex-shrink: 0; }

    /* --- UI Komponenten & Utilities --- */
    .header {
      background: #ffffff;
      border-bottom: 1px solid #d9d9d9;
      flex-shrink: 0;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 25px;
    }

    .filter-bar {
      background: #ffffff;
      border-bottom: 1px solid #d9d9d9;
      padding: 10px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .feed-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* Form-Elemente */
    select, input, button {
      font-family: 'Lato', sans-serif;
      outline: none;
    }
    
    .input-field {
      background: #f4f4f4;
      border: 1px solid #d9d9d9;
      padding: 6px 12px;
      font-size: 13px;
      width: 160px;
    }

    .select-dropdown {
      background: #ffffff;
      border: 1px solid #d9d9d9;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #34384f;
      cursor: pointer;
    }

    /* Cards & Rows */
    .card {
      background: #ffffff;
      border: 1px solid #d9d9d9;
      padding: 16px 20px;
      margin-bottom: 10px;
      transition: all 0.15s ease-in-out;
    }
    .card:hover {
      border-color: #b3e2f5;
      box-shadow: 0 4px 12px rgba(0, 159, 223, 0.08);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.1s ease;
    }
    .brand-row.active {
      background: #e6f6fc;
      border-left-color: #009fdf;
    }

    /* Buttons */
    .btn-primary {
      background: #34384f;
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #d9d9d9;
      color: #70706f;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-danger {
      background: transparent;
      border: 1px solid rgba(230, 59, 17, 0.3);
      color: #e63b11;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    /* Progress Bar */
    .progress-track {
      background: #f4f4f4;
      height: 4px;
      width: 100%;
      margin-top: 5px;
    }
    .progress-fill {
      height: 100%;
      transition: width 0.5s ease-out;
    }
  </style>
</head>
